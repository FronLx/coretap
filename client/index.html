<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07080c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" />
    <title>CoreTap</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background:
          radial-gradient(56% 44% at 14% 4%, rgba(201, 207, 221, 0.07), transparent 62%),
          radial-gradient(60% 50% at 55% 110%, rgba(34, 211, 238, 0.05), transparent 64%),
          linear-gradient(180deg, #0c0e11 0%, #050607 48%, #040506 100%);
        transition: opacity 0.5s ease;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot-ring {
        position: relative;
        width: 88px;
        height: 88px;
      }
      .boot-ring::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(201, 207, 221, 0.1);
        border-top-color: #c9cfdd;
        border-right-color: #d7dbe3;
        animation: bootSpin 0.9s linear infinite;
        box-shadow: 0 0 34px -8px rgba(201, 207, 221, 0.4);
      }
      .boot-ring::after {
        content: '';
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        border: 1px dashed rgba(218, 221, 229, 0.2);
        animation: bootSpin 7s linear infinite reverse;
      }
      .boot-bolt {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #dadde5;
        filter: drop-shadow(0 0 12px rgba(218, 221, 229, 0.6));
        animation: bootPulse 1.6s ease-in-out infinite;
      }
      .boot-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 6px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #c8cdd8, #f4f6fa, #a8bec8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 20px rgba(201, 207, 221, 0.25));
      }
      .boot-dots {
        display: flex;
        gap: 6px;
      }
      .boot-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c9cfdd;
        box-shadow: 0 0 8px rgba(201, 207, 221, 0.6);
        animation: bootDot 1.2s ease-in-out infinite;
      }
      .boot-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .boot-dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.88); opacity: 0.7; }
      }
      @keyframes bootDot {
        0%, 100% { transform: translateY(0); opacity: 0.35; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-ring">
        <svg class="boot-bolt" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div class="boot-title">CoreTap</div>
      <div class="boot-dots"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
